<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading AI Platform</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header><b>🤖 Trading AI</b><span id="mode">PAPER</span></header>
<main>
<section class="hero"><h1>Painel de Trading</h1><p>Estratégias, IA, risco e automação em um só lugar.</p></section>
<div class="grid">
  <article><h3>💰 Status</h3><div id="stats">Carregando...</div></article>
  <article><h3>🛡️ Risco</h3><div id="risk">Carregando...</div></article>
  <article><h3>💳 Assinatura</h3><div id="subscription">Carregando...</div></article>
  <article><h3>📈 Estratégias</h3><button onclick="loadStrategies()">Atualizar</button><pre id="strategies"></pre></article>
</div>
<section class="panel">
<h2>🧪 Simulação</h2>
<button onclick="simulate()">Simular ordem PAPER</button>
<pre id="result"></pre>
</section>
<section class="panel">
<h2>🛡️ Emergência</h2>
<button class="danger" onclick="killSwitch()">ATIVAR KILL SWITCH</button>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
