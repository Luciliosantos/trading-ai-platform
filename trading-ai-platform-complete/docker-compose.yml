services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./backend
    env_file: .env
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis
      - ai-service

  telegram-bot:
    build: ./telegram-bot
    env_file: .env
    depends_on:
      - api

  ai-service:
    build: ./ai-service
    env_file: .env
    expose:
      - "8000"

  worker:
    build: ./workers
    env_file: .env
    depends_on:
      - postgres
      - redis
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
